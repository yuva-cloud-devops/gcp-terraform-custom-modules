availability:
  project_id: "yuvaraj-internal-project"
  region: "asia-south1"

  tags:
    environment: "testing"
    managed_by: "terraform"

  # ============================================================================
  # 1. Global External Application Load Balancer (Plug & Play - Attached to MIG)
  # ============================================================================
  external_http_lb:
    name: "glb-web-app"
    load_balancing_scheme: "EXTERNAL_MANAGED"
    port: 80
    target_mig: "web-app-regional-mig"
    named_port: "http"

    enable_cdn: true
    cdn_policy:
      cache_mode: "CACHE_ALL_STATIC"
      default_ttl: 3600
      max_ttl: 86400
      client_ttl: 3600
      negative_caching: true

    health_check:
      type: "HTTP"
      port: 3000
      request_path: "/"
      check_interval_sec: 10
      timeout_sec: 5
      healthy_threshold: 2
      unhealthy_threshold: 3
      logging: true

    outlier_detection:
      consecutive_errors: 5
      base_ejection_time:
        seconds: 30

    log_config:
      enable: true
      sample_rate: 1.0

