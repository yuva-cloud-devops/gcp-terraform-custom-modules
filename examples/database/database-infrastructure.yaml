database_infrastructure:
  project_id: "yuvaraj-internal-project"
  region: "asia-south1"
  # Default VPC network utilized when no specific VPC is declared
  network: "projects/yuvaraj-internal-project/global/networks/default"

  # =========================================================================
  # 1. CLOUD SQL (PostgreSQL / MySQL) - [HA, SSL, Automated 7-Day Backups]
  # =========================================================================
  cloud_sql:
    instances:
      secops-demo-pg-db:
        database_version: "POSTGRES_15"
        tier: "db-custom-2-7680"
        availability_type: "REGIONAL" # High Availability with automatic cross-zone failover
        disk_type: "PD_SSD"
        disk_size_gb: 20
        disk_autoresize: true
        disk_autoresize_limit: 100
        deletion_protection: false
        private_network: "projects/yuvaraj-internal-project/global/networks/default"
        # Public IP enabled as fallback for instant connectivity when PSA is absent
        ipv4_enabled: true
        ssl_mode: "ENCRYPTED_ONLY"
        enable_point_in_time_recovery: true
        backup_retention_days: 7
        backup_start_time: "02:00"
        transaction_log_retention_days: 7
        database_flags:
          max_connections: "200"
          log_checkpoints: "on"
        databases:
          - name: "app_production"
            charset: "UTF8"
            collation: "en_US.UTF8"
        users:
          - name: "app_user"
            password: "DemoUserPassword123!"

  # =========================================================================
  # 2. ALLOYDB FOR POSTGRESQL - [Cluster HA, Continuous Backups, Read Pool]
  # =========================================================================
  alloydb:
    clusters:
      secops-demo-alloydb:
        network: "projects/yuvaraj-internal-project/global/networks/default"
        continuous_backup_retention_days: 14
        weekly_backup_days:
          - "SUNDAY"
          - "WEDNESDAY"
        weekly_backup_time: "03:00"
        deletion_protection: false
        primary_instance:
          instance_id: "alloydb-primary"
          cpu_count: 2
        read_pools:
          - instance_id: "alloydb-read-pool-1"
            cpu_count: 2
            node_count: 1

  # =========================================================================
  # 3. MEMORYSTORE FOR REDIS - [STANDARD_HA Multi-Zone, RDB Snapshots]
  # =========================================================================
  memorystore_redis:
    instances:
      secops-demo-redis:
        tier: "STANDARD_HA" # Cross-zone replica with automatic failover
        memory_size_gb: 1
        redis_version: "REDIS_7_0"
        network: "projects/yuvaraj-internal-project/global/networks/default"
        auth_enabled: true
        transit_encryption_mode: "SERVER_AUTHENTICATION"
        rdb_snapshot_period: "TWELVE_HOURS"

  # =========================================================================
  # 4. FIRESTORE / DATASTORE - [Serverless NoSQL, PITR, Daily Backup Schedule]
  # =========================================================================
  firestore:
    databases:
      secops-demo-firestore:
        name: "secops-nosql-db"
        type: "FIRESTORE_NATIVE"
        location_id: "asia-south1"
        delete_protection_state: "DELETE_PROTECTION_ENABLED"
        point_in_time_recovery_enablement: "POINT_IN_TIME_RECOVERY_ENABLED"
        backup_schedules:
          - retention_days: 14
            recurrence: "daily"

  # =========================================================================
  # 5. CLOUD SPANNER - [Global Multi-Region / Regional 99.999% SLA RDBMS]
  # =========================================================================
  spanner:
    instances:
      secops-demo-spanner:
        config: "regional-asia-south1"
        display_name: "Enterprise Spanner Instance"
        processing_units: 100 # Cost-effective dev/test sizing (0.1 node)
        deletion_protection: false
        databases:
          - name: "ecommerce-db"
            version_retention_period: "7d" # Point-in-Time Recovery
            deletion_protection: false
            ddl:
              - "CREATE TABLE Customers (CustomerId STRING(36) NOT NULL, Email STRING(255), Name STRING(255)) PRIMARY KEY (CustomerId)"
            backup_schedules:
              - name: "daily-spanner-backup"
                retention_duration: "604800s" # 7 days
                cron_spec: "0 2 * * *"

  # =========================================================================
  # 6. CLOUD BIGTABLE - [Low-Latency High-Throughput NoSQL]
  # =========================================================================
  bigtable:
    instances:
      secops-demo-bigtable:
        display_name: "Analytics Bigtable Cluster"
        deletion_protection: false
        clusters:
          - cluster_id: "analytics-cluster-1"
            zone: "asia-south1-a"
            num_nodes: 1
            storage_type: "SSD"
        tables:
          - name: "telemetry_events"
            column_families:
              - family: "metrics"
              - family: "device_info"
