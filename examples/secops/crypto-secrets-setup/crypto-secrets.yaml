# ==============================================================================
# CRYPTO & SECRETS INFRASTRUCTURE CONFIGURATION
# ==============================================================================
# Enterprise-grade Cloud KMS and Secret Manager configuration declaring
# Customer-Managed Encryption Keys (CMEK), rotation policies, Hardware Security
# Modules (HSM), automated replication, secret lifecycles, and least-privilege IAM.
# ==============================================================================

project_id: "prj-secops-prod-01"
default_location: "asia-south1"

common_labels:
  environment: "production"
  managed_by: "terraform"
  domain: "secops"
  security_tier: "tier-1"

# ==============================================================================
# 1. Cloud KMS (Keyrings, CryptoKeys, Version Templates & IAM)
# ==============================================================================
kms:
  # Optional project-level KMS IAM bindings
  project_iam:
    - role: "roles/cloudkms.admin"
      members:
        - "group:gcp-kms-admins@example.com"

  keyrings:
    - name: "secops-keyring-mumbai"
      location: "asia-south1"
      
      # Keyring-level IAM members
      iam:
        - role: "roles/cloudkms.viewer"
          members:
            - "group:gcp-security-auditors@example.com"

      # Cryptographic Keys
      keys:
        # Key 1: CMEK for GKE Application Layer & Secret Encryption
        - name: "cmek-gke-etcd"
          purpose: "ENCRYPT_DECRYPT"
          rotation_period: "7776000s"          # 90 Days automated rotation
          destroy_scheduled_duration: "86400s" # 24 Hours destruction delay
          labels:
            workload: "gke"
            component: "etcd-envelope"
          version_template:
            algorithm: "GOOGLE_SYMMETRIC_ENCRYPTION"
            protection_level: "SOFTWARE"
          iam:
            - role: "roles/cloudkms.cryptoKeyEncrypterDecrypter"
              members:
                - "serviceAccount:service-1029384756@container-engine-robot.iam.gserviceaccount.com"

        # Key 2: High-Assurance CMEK for Cloud SQL Database Storage (FIPS 140-2 Level 3 HSM)
        - name: "cmek-cloud-sql"
          purpose: "ENCRYPT_DECRYPT"
          rotation_period: "2592000s"          # 30 Days automated rotation
          destroy_scheduled_duration: "604800s" # 7 Days destruction delay
          labels:
            workload: "database"
            compliance: "pci-dss"
          version_template:
            algorithm: "GOOGLE_SYMMETRIC_ENCRYPTION"
            protection_level: "HSM"
          iam:
            - role: "roles/cloudkms.cryptoKeyEncrypterDecrypter"
              members:
                - "serviceAccount:p1029384756-abcdef@gcp-sa-cloud-sql.iam.gserviceaccount.com"

        # Key 3: Multi-purpose CMEK for Cloud Storage Buckets & BigQuery Datasets
        - name: "cmek-storage-analytics"
          purpose: "ENCRYPT_DECRYPT"
          rotation_period: "7776000s"          # 90 Days automated rotation
          destroy_scheduled_duration: "86400s"
          labels:
            workload: "storage"
          version_template:
            algorithm: "GOOGLE_SYMMETRIC_ENCRYPTION"
            protection_level: "SOFTWARE"
          iam:
            - role: "roles/cloudkms.cryptoKeyEncrypterDecrypter"
              members:
                - "serviceAccount:service-1029384756@gs-project-accounts.iam.gserviceaccount.com"
                - "serviceAccount:bq-1029384756@bigquery-encryption.iam.gserviceaccount.com"

        # Key 4: Asymmetric Digital Signing Key (FIPS 140-2 Level 3 HSM)
        - name: "app-code-signing-key"
          purpose: "ASYMMETRIC_SIGN"
          labels:
            workload: "ci-cd-signer"
          version_template:
            algorithm: "RSA_SIGN_PSS_2048_SHA256"
            protection_level: "HSM"
          iam:
            - role: "roles/cloudkms.signerVerifier"
              members:
                - "serviceAccount:sa-release-pipeline@prj-secops-prod-01.iam.gserviceaccount.com"

# ==============================================================================
# 2. Secret Manager (Secrets, Automatic/User-Managed Replication, CMEK & IAM)
# ==============================================================================
secret_manager:
  # Optional project-level Secret Manager IAM bindings
  project_iam:
    - role: "roles/secretmanager.viewer"
      members:
        - "group:gcp-security-auditors@example.com"

  secrets:
    # Secret 1: Database Master Credentials with Automatic CMEK Encryption & Rotation
    - secret_id: "db-credentials-master"
      labels:
        application: "order-service"
        database: "postgresql"
      annotations:
        security_poc: "secops@example.com"
        runbook: "https://wiki.example.com/secops/db-creds-rotation"

      # Automatic replication encrypted with CMEK key provisioned in this module
      replication:
        type: "automatic"
        customer_managed_encryption:
          kms_key_name: "secops-keyring-mumbai/cmek-cloud-sql"

      # Automated 30-day rotation notification policy
      rotation:
        rotation_period: "2592000s" # 30 Days

      # Cloud Pub/Sub topic to notify microservices / Cloud Functions on rotation
      topics:
        - name: "projects/prj-secops-prod-01/topics/secret-rotation-alerts"

      # Initial secret payload provisioned securely
      version:
        enabled: true
        secret_data: "P@ssw0rdSecureProduction2026!"
        deletion_policy: "DELETE"

      # Secret-level Access Control (Least Privilege)
      iam:
        - role: "roles/secretmanager.secretAccessor"
          members:
            - "serviceAccount:sa-order-service@prj-secops-prod-01.iam.gserviceaccount.com"
        - role: "roles/secretmanager.secretVersionManager"
          members:
            - "group:gcp-database-admins@example.com"

    # Secret 2: OAuth API JWT Private Key with Multi-Region User-Managed Replication
    - secret_id: "oauth-jwt-private-key"
      labels:
        service: "identity-provider"
      annotations:
        auth_protocol: "oauth2-oidc"

      # User-managed replication across distinct Indian cloud regions
      replication:
        type: "user_managed"
        replicas:
          - location: "asia-south1"
          - location: "asia-south2"

      # Secret container without Terraform-managed version (managed out-of-band by CI/CD)
      iam:
        - role: "roles/secretmanager.secretAccessor"
          members:
            - "serviceAccount:sa-auth-service@prj-secops-prod-01.iam.gserviceaccount.com"

    # Secret 3: Temporary Third-Party Payment Gateway API Token with TTL
    - secret_id: "payment-gateway-api-token"
      labels:
        service: "checkout-gateway"
      ttl: "7776000s" # 90 days time-to-live before automatic destruction
      replication:
        type: "automatic"
      iam:
        - role: "roles/secretmanager.secretAccessor"
          members:
            - "serviceAccount:sa-checkout-service@prj-secops-prod-01.iam.gserviceaccount.com"
          condition:
            title: "prod_working_hours_only"
            description: "Allows access only during authorized time windows"
            expression: "request.time < timestamp('2027-01-01T00:00:00Z')"
