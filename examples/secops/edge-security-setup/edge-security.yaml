edge_security:
  project_id: "yuvaraj-internal-project"

  # =========================================================================
  # 1. CLOUD ARMOR WAF (Minimal Policy with SQLi Protection)
  # =========================================================================
  cloud_armor_policies:
    minimal-waf-policy:
      description: "Minimal Edge WAF with OWASP SQLi defense"
      default_rule_action: "allow"
      adaptive_protection: true
      rules:
        block-sqli:
          priority: 1000
          action: "deny(403)"
          description: "Block SQL injection attempts"
          owasp_ruleset: "sqli-v33-stable"

  # =========================================================================
  # 2. CLOUD IDS (Minimal Deep Packet Inspection Endpoint)
  # =========================================================================
  cloud_ids_endpoints:
    minimal-ids-endpoint:
      location: "asia-south1"
      network: "default"
      severity: "MEDIUM"
      description: "Cloud IDS threat inspection on default VPC"

  # =========================================================================
  # 3. VPC SERVICE CONTROLS (Access Context Manager Perimeter)
  # =========================================================================
  # NOTE: Replace with your numeric Org Access Policy ID and Project Number
  vpc_service_controls:
    access_policy_id: "123456789012" # From: gcloud access-context-manager policies list --organization=ORG_ID
    
    access_levels:
      trusted-office-ip:
        title: "Trusted Office IP"
        ip_subnetworks:
          - "103.21.244.0/24"

    service_perimeters:
      minimal-data-perimeter:
        title: "Data Exfiltration Protection Perimeter"
        restricted_services:
          - "storage.googleapis.com"
          - "bigquery.googleapis.com"
        resources:
          - "projects/986244541727"   # VPC SC requires projects/<NUMERIC_PROJECT_NUMBER>
        access_levels:
          - "trusted-office-ip"